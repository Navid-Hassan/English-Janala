<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <title>English Janala</title>

  <!-- Style -->
  <link rel="stylesheet" href="style.css">



</head>

<body>
  <header>
    <div class="flex justify-between p-4 bg-[#98C9F6]">
      <div class="flex items-center">
        <div class="font-bold">English</div>
        <img class="h-[2em]" src="./assets/logo.png" alt="" />জানালা
      </div>
      <div class="flex gap-3">
        <button class="btn border-[#422AD5] bg-[#98C9F6]">
          <img src="./assets/fa-circle-question.png" alt="" /> FAQ
        </button>
        <button class="btn border-[#422AD5] bg-[#98C9F6]">
          <img src="./assets/fa-book-open.png" alt="" /> Learn
        </button>
        <button class="btn border-[#422AD5] bg-[#98C9F6]">
          <img src="./assets/fa-arrow-right-from-bracket.png" alt="" /> Logout
        </button>
      </div>
    </div>
    <div class="flex flex-col items-center p-2 sm:p-4 sm:flex-row-reverse">
      <img src="./assets/hero-student.png" alt="">
      <div class="head2 grid gap-1 sm:w-[50%]">
        <h2 class="font-bold"><span class="text-[#00BCFF] hind-siliguri">English</span> is Easy!!</h2>
        <p>আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি নতুন হন অথবা আপনার দক্ষতা বাড়াতে চান, আমাদের Interactive
          Lessons আপনাকে নিয়ে যাবে অন্য একটি Level এ</p>
        <div class="flex flex-col sm:w-[20%] gap-2 items-center sm:items-start">
          <input type="text" placeholder="Enter Your Name" class="p-2 border-[rgba(24,24,27,0.2)] rounded-[5px]">
          <input type="text" class="rounded-[5px] p-2 border-[rgba(24,24,27,0.2)] rounded-[5px]">
          <button class="btn btn-primary">Get Started</button>
        </div>
      </div>
  </header>
  <main class="mt-[20px]">
    <section class="flex flex-col items-center gap-[20px]">
      <h1 class="font-bold text-xl"><span class="text-[#00BCFF]">Let's</span> Learn Vocabularies</h1>
      <div id="level-container"
        class="flex flex-col flex-wrap w-[50%] justify-center sm:flex-row gap-[10px] sm:gap-[20px]">
      </div>
    </section>
    <section id="word-container" class="bg-gray-100 mt-[20px] p-5 mx-auto w-11/12 sm:grid sm:grid-cols-3 sm:gap-3 rounded-[24px]">
      <div class="col-span-full flex flex-col items-center justify-center gap-2 h-[200px] space-y-3">
        <p class="text-sm  text-gray-400">আপনি এখনো কোন Lesson Select করেন নি</p>
      <h1 class="text-3xl font-medium text-gray-900">একটি Lesson Select করুন।</h1>
      </div>
    </section>
  </main>
  <footer></footer>
  <script src="/script/index.js"></script>
</body>

</html>
